<!-- navbar.component.html - ACTUALIZADO PARA LA NUEVA CONFIGURACIÓN -->
<nav class="navbar" 
     [class.scrolled]="isScrolled"
     [class]="getSectionClass()"
     [class.menu-open]="isMenuOpen">
  
  <!-- CAPA SÓLIDA DETRÁS - SOLO PARA RESPONSIVE -->
  <div class="navbar-solid-layer" [style.background]="getNavbarBackground()"></div>
  
  <div class="nav-container">
    <!-- Logo izquierda -->
    <div class="nav-logo">
      <a href="#hero" class="logo-link" (click)="scrollToSection('hero', $event)">
        
      </a>
    </div>

    <!-- Hamburguesa móvil -->
    <div class="nav-toggle" (click)="toggleMenu($event)">
      <div class="hamburger" [class.active]="hamburgerActive">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Navigation Links Desktop (oculto en móvil) -->
    <div class="nav-menu">
      <div class="nav-links">
        <a *ngFor="let section of mainSections"
           class="nav-link" 
           [class.active]="isActiveSection(section.id)"
           (click)="handleSectionClick(section, $event)">
          <span class="link-text">{{ section.name }}</span>
          <div class="link-line"></div>
        </a>
      </div>
    </div>

    <!-- Social Links Desktop -->
    <div class="social-links-desktop">
      <a *ngFor="let social of socialNetworks"
         [href]="social.url"
         class="social-link"
         [title]="social.name"
         (click)="openExternalLink(social.url, $event)"
         target="_blank"
         rel="noopener noreferrer">
        <svg *ngIf="social.id === 'github'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 19C4 20.5 4 16.5 2 16M16 22V18.13C16.0375 17.6532 15.9731 17.1738 15.811 16.7238C15.6489 16.2738 15.3929 15.8634 15.06 15.52C18.2 15.17 21.5 13.98 21.5 8.52C21.4997 7.12383 20.9627 5.7812 20 4.77C20.4559 3.54851 20.4236 2.19835 19.91 1C19.91 1 18.73 0.65 16 2.48C13.708 1.85882 11.292 1.85882 9 2.48C6.27 0.65 5.09 1 5.09 1C4.57638 2.19835 4.54414 3.54851 5 4.77C4.03013 5.7887 3.49252 7.14346 3.5 8.55C3.5 13.97 6.8 15.16 9.94 15.55C9.611 15.89 9.35726 16.2954 9.19531 16.7399C9.03335 17.1844 8.96681 17.6581 9 18.13V22"/>
        </svg>
        <svg *ngIf="social.id === 'linkedin'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 8C17.5913 8 19.1174 8.63214 20.2426 9.75736C21.3679 10.8826 22 12.4087 22 14V21H18V14C18 13.4696 17.7893 12.9609 17.4142 12.5858C17.0391 12.2107 16.5304 12 16 12C15.4696 12 14.9609 12.2107 14.5858 12.5858C14.2107 12.9609 14 13.4696 14 14V21H10V14C10 12.4087 10.6321 10.8826 11.7574 9.75736C12.8826 8.63214 14.4087 8 16 8Z"/>
          <path d="M6 9H2V21H6V9Z"/>
          <path d="M4 6C5.10457 6 6 5.10457 6 4C6 2.89543 5.10457 2 4 2C2.89543 2 2 2.89543 2 4C2 5.10457 2.89543 6 4 6Z"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" [class.active]="isMenuOpen" (click)="closeMenu()">
    <div class="mobile-menu-content" (click)="$event.stopPropagation()">
      <div class="mobile-menu-header">
        <div class="mobile-logo">Santiago Arbelaez</div>
        <button class="mobile-close" (click)="closeMenu()">
          <span></span>
          <span></span>
        </button>
      </div>
      
      <div class="mobile-nav-links">
        <!-- Secciones principales -->
        <div class="mobile-section">
          <a *ngFor="let section of mainSections"
             class="mobile-nav-link" 
             [class.active]="isActiveSection(section.id)"
             (click)="handleSectionClick(section, $event)">
            <span class="mobile-link-text">{{ section.name }}</span>
            <div class="mobile-link-line"></div>
          </a>
        </div>

        <!-- Redes Sociales -->
        <div class="mobile-subsection">
          <div class="subsection-title">Sígueme</div>
          <a *ngFor="let social of socialNetworks"
             [href]="social.url"
             class="mobile-nav-link subsection-link"
             (click)="openExternalLink(social.url, $event)"
             target="_blank"
             rel="noopener noreferrer">
            <span class="mobile-link-text">{{ social.name }}</span>
            <span class="external-indicator">↗</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
